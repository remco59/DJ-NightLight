    put:
      operationId: putAdminIntegrations
      tags:
        - admin/integrations
      security:
        - staffSession: []
      x-roles:
        - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    provider:
                      type: string
                      const: calendar
                    enabled:
                      type: boolean
                    calendarId:
                      type: string
                      minLength: 1
                      maxLength: 255
                    cancellationBehavior:
                      type: string
                      enum:
                        - delete
                        - mark_cancelled
                        - keep
                    credentials:
                      type: object
                      properties:
                        clientId:
                          type: string
                          minLength: 1
                          maxLength: 500
                        clientSecret:
                          type: string
                          minLength: 1
                          maxLength: 4000
                        refreshToken:
                          type: string
                          minLength: 1
                          maxLength: 8000
                      required:
                        - clientId
                        - clientSecret
                        - refreshToken
                  required:
                    - provider
                    - enabled
                    - calendarId
                    - cancellationBehavior
                - type: object
                  properties:
                    provider:
                      type: string
                      const: email
                    apiKey:
                      type: string
                      minLength: 8
                      maxLength: 8000
                    from:
                      type: string
                      maxLength: 500
                    reviewUrl:
                      type: string
                      maxLength: 2000
                  required:
                    - provider
                    - from
                    - reviewUrl
                - type: object
                  properties:
                    provider:
                      type: string
                      const: instagram
                    appId:
                      type: string
                      pattern: ^\d{5,30}$
                    appSecret:
                      type: string
                      minLength: 16
                      maxLength: 200
                    loginConfigId:
                      anyOf:
                        - type: string
                          pattern: ^\d{5,30}$
                        - type: string
                          const: ""
                  required:
                    - provider
                    - appId
                    - appSecret
                    - loginConfigId
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteAdminIntegrations
      tags:
        - admin/integrations
      security:
        - staffSession: []
      x-roles:
        - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - calendar
                    - email
                    - instagram
              required:
                - provider
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":

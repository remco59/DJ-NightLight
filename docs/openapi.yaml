                  type: integer
                  minimum: 0
                  maximum: 10000
                paymentTerms:
                  type: string
                  maxLength: 5000
                legalText:
                  type: string
                  maxLength: 5000
                notes:
                  type: string
                  maxLength: 5000
                lines:
                  minItems: 1
                  maxItems: 100
                  type: array

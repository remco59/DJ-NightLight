                        default: ""
                        type: string
                        maxLength: 240
                      spotifyUrl:
                        default: ""
                        type: string
                        maxLength: 1000
                      note:
                        default: ""
                        type: string
                        maxLength: 2000
                      ordering:
                        type: integer
                        minimum: 0
                        maximum: 500
                    required:
                      - category
                      - ordering
              required:
                - answers
                - acceptedName
                - wishes

components:
  responses:
    BadRequest:
      description: Ongeldig verzoek
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Niet ingelogd
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Geen toegang voor deze rol
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Niet gevonden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict met de huidige status
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: De ingestuurde gegevens zijn ongeldig
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Te veel verzoeken (zie Retry-After)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: nuxt-session
      description: Sessiecookie na `POST /api/auth/login`
    stripeSignature:
      type: apiKey
      in: header
      name: stripe-signature
      description: Handtekening van Stripe over de ruwe body
    bootstrapToken:
      type: apiKey
      in: header
      name: x-bootstrap-token
      description: Eenmalige `OWNER_BOOTSTRAP_TOKEN` om de eerste eigenaar aan te maken
  schemas:
    Error:
      type: object
      required:
        - statusCode
        - statusMessage
      properties:
        statusCode:
          type: integer
        statusMessage:
          type: string
          description: Korte foutmelding (Nederlands)

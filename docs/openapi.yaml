openapi: 3.1.0
info:
  title: DJ NightLight API
  version: 1.0.0
  description: |-
    Gegenereerd uit `server/api` met `npm run docs:openapi`. Niet met de hand bewerken.

    Admin-routes vragen een ingelogde sessie (cookie `nuxt-session`) met een van de genoemde rollen (`x-roles`).
    Klantportaal- en agenda-feed-routes hebben een geheim token in het pad (`x-access`); alle andere routes zonder beveiliging zijn publiek.
    Foutresponses hebben de vorm `{ statusCode, statusMessage }`.
    De antwoord-bodies zijn niet per route beschreven; zie de route-broncode voor de precieze velden.
tags:
  - name: admin/account
    description: Back office (ingelogde medewerkers)
  - name: admin/business-settings
    description: Back office (ingelogde medewerkers)
  - name: admin/calendar
    description: Back office (ingelogde medewerkers)
  - name: admin/clients
    description: Back office (ingelogde medewerkers)
  - name: admin/content
    description: Back office (ingelogde medewerkers)
  - name: admin/dashboard
    description: Back office (ingelogde medewerkers)
  - name: admin/email
    description: Back office (ingelogde medewerkers)
  - name: admin/gigs
    description: Back office (ingelogde medewerkers)
  - name: admin/integrations
    description: Back office (ingelogde medewerkers)
  - name: admin/invoices
    description: Back office (ingelogde medewerkers)
  - name: admin/landing-pages
    description: Back office (ingelogde medewerkers)
  - name: admin/me
    description: Back office (ingelogde medewerkers)
  - name: admin/media
    description: Back office (ingelogde medewerkers)
  - name: admin/post-generator
    description: Back office (ingelogde medewerkers)
  - name: admin/questionnaire
    description: Back office (ingelogde medewerkers)
  - name: admin/render-settings
    description: Back office (ingelogde medewerkers)
  - name: admin/reviews
    description: Back office (ingelogde medewerkers)
  - name: admin/session
    description: Back office (ingelogde medewerkers)
  - name: admin/social
    description: Back office (ingelogde medewerkers)
  - name: admin/stripe
    description: Back office (ingelogde medewerkers)
  - name: admin/system
    description: Back office (ingelogde medewerkers)
  - name: admin/users
    description: Back office (ingelogde medewerkers)
  - name: admin/venues
    description: Back office (ingelogde medewerkers)
  - name: admin/video-projects
    description: Back office (ingelogde medewerkers)
  - name: auth
    description: Inloggen, uitloggen en de eerste eigenaar aanmaken
  - name: calendar
    description: Agenda-feed (ICS)
  - name: client
    description: Klantportaal via een persoonlijke link
  - name: generated-posts
  - name: generated-videos
  - name: health
  - name: maintenance
  - name: media
  - name: public
    description: Publieke website-inhoud en het contactformulier
  - name: ready
  - name: video-project-thumbnails
  - name: webhooks
    description: Inkomende webhooks van externe diensten
paths:
  /api/admin/account/password:
    post:
      operationId: postAdminAccountPassword
      tags:
        - admin/account
      security:
        - staffSession: []
      x-roles: any signed-in staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                  maxLength: 200
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 200
                confirmPassword:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - currentPassword
                - newPassword
                - confirmPassword
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/admin/business-settings:
    get:
      operationId: getAdminBusinessSettings
      tags:
        - admin/business-settings
      security:
        - staffSession: []
      x-roles:
        - owner
        - manager
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putAdminBusinessSettings
      tags:
        - admin/business-settings
      security:
        - staffSession: []
      x-roles:
        - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                  minLength: 1
                  maxLength: 240
                address:
                  type: string
                  maxLength: 500
                postalCode:
                  type: string
                  maxLength: 32
                city:
                  type: string
                  maxLength: 160
                country:
                  type: string
                  maxLength: 120
                email:
                  anyOf:
                    - type: string
                      const: ""
                    - type: string
                      format: email
                      pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                phone:
                  type: string
                  maxLength: 64
                registrationNumber:
                  type: string
                  maxLength: 80
                vatNumber:
                  type: string
                  maxLength: 80
                iban:
                  type: string
                  maxLength: 64
                invoicePrefix:
                  type: string
                  minLength: 1
                  maxLength: 16
                defaultVatMode:
                  type: string
                  enum:
                    - exclusive
                    - inclusive
                    - exempt
                defaultVatRateBasisPoints:
                  type: integer
                  minimum: 0
                  maximum: 10000
                defaultPaymentTermDays:
                  type: integer
                  minimum: 0
                  maximum: 365
                paymentTerms:
                  type: string
                  maxLength: 5000
                legalText:
                  type: string
                  maxLength: 5000
              required:
                - companyName
                - address
                - postalCode
                - city
                - country
                - email
                - phone
                - registrationNumber
                - vatNumber
                - iban
                - invoicePrefix
                - defaultVatMode
                - defaultVatRateBasisPoints
                - defaultPaymentTermDays
                - paymentTerms
                - legalText
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/admin/calendar:
    get:
      operationId: getAdminCalendar
      tags:
        - admin/calendar
      security:
        - staffSession: []
      x-roles:
        - owner
        - manager
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/calendar/events:
    get:
      operationId: getAdminCalendarEvents
      tags:
        - admin/calendar
      security:
        - staffSession: []
      x-roles:
        - owner
        - manager
        - dj
      parameters:
        - name: end
          in: query
          required: false
          schema:
            type: string
        - name: start
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/calendar/ics-token:
    post:
      operationId: postAdminCalendarIcsToken
      tags:
        - admin/calendar
      security:
        - staffSession: []
      x-roles:
        - owner
        - manager
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/calendar/settings:
    put:
      operationId: putAdminCalendarSettings
      tags:
        - admin/calendar
      security:
        - staffSession: []
      x-roles: any signed-in staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                calendarId:
                  type: string
                  minLength: 1
                  maxLength: 255
                cancellationBehavior:
                  type: string
                  enum:
                    - delete
                    - mark_cancelled
                    - keep
              required:
                - enabled
                - calendarId
                - cancellationBehavior
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/admin/calendar/sync:
    post:
      operationId: postAdminCalendarSync
      tags:
        - admin/calendar
      security:
        - staffSession: []
      x-roles: any signed-in staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gigId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/admin/clients:
    get:
      operationId: getAdminClients
      tags:
        - admin/clients
      security:
        - staffSession: []
      x-roles: any signed-in staff member
      parameters:
        - name: hasEmail
          in: query
          required: false
          schema:
            type: string
        - name: hasGigs
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postAdminClients
      tags:
        - admin/clients
      security:
        - staffSession: []
      x-roles: any signed-in staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - person
                    - company
                firstName:
                  type: string
                  maxLength: 120
                lastName:
                  type: string
                  maxLength: 120
                companyName:
                  type: string
                  maxLength: 200
                email:
                  type: string
                  maxLength: 320
                invoiceEmail:
                  type: string
                  maxLength: 320
                phone:
                  type: string
                  maxLength: 64
                billingAddress:
                  type: string
                  maxLength: 1000
                notes:
                  type: string
                  maxLength: 5000
                emailAutomationDisabled:
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 80
              required:
                - type
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/admin/clients/{id}:
    get:
      operationId: getAdminClientsById
      tags:
        - admin/clients
      security:
        - staffSession: []
      x-roles: any signed-in staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putAdminClientsById
      tags:
        - admin/clients
      security:
        - staffSession: []
      x-roles: any signed-in staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - person
                    - company
                firstName:
                  type: string
                  maxLength: 120
                lastName:
                  type: string
                  maxLength: 120
                companyName:
                  type: string
                  maxLength: 200
                email:
                  type: string
                  maxLength: 320
                invoiceEmail:
                  type: string
                  maxLength: 320
                phone:
                  type: string
                  maxLength: 64
                billingAddress:
                  type: string
                  maxLength: 1000
                notes:
                  type: string
                  maxLength: 5000
                emailAutomationDisabled:
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 80
              required:
                - type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteAdminClientsById
      tags:
        - admin/clients
      security:
        - staffSession: []
      x-roles:
        - owner
        - manager
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/content:
    get:
      operationId: getAdminContent
      tags:
        - admin/content
      security:
        - staffSession: []
      x-roles:
        - owner
        - manager
        - content_editor
      responses:
        "200":
          description: Gelukt
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putAdminContent
      tags:
        - admin/content
      security:
        - staffSession: []
      x-roles:
        - owner
        - manager
        - content_editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brandName:
                  type: string
                  minLength: 1
                  maxLength: 120
                heroEyebrow:
                  type: string
                  minLength: 1
                  maxLength: 160
                heroTitle:
                  type: string
                  minLength: 1
                  maxLength: 300
                heroBody:
                  type: string
                  minLength: 1
                  maxLength: 3000
                heroImageUrl:
                  type: string
                  maxLength: 2000
                heroCtaLabel:
                  type: string
                  minLength: 1
                  maxLength: 120
                aboutEyebrow:
                  type: string
                  minLength: 1
                  maxLength: 160
                aboutTitle:
                  type: string
                  minLength: 1
                  maxLength: 300
                aboutBody:
                  type: string
                  minLength: 1
                  maxLength: 8000
                mediaEyebrow:
                  type: string
                  minLength: 1
                  maxLength: 160
                mediaTitle:
                  type: string
                  minLength: 1
                  maxLength: 300
                mediaBody:
                  type: string
                  minLength: 1
                  maxLength: 4000
                showreelUrl:
                  type: string
                  maxLength: 2000
                agendaEyebrow:
                  type: string
                  minLength: 1
                  maxLength: 160
                agendaTitle:
                  type: string
                  minLength: 1
                  maxLength: 300
                agendaBody:
                  type: string
                  minLength: 1
                  maxLength: 4000
                bookingEyebrow:
                  type: string
                  minLength: 1
                  maxLength: 160
                bookingTitle:
                  type: string
                  minLength: 1
                  maxLength: 300
                bookingBody:
                  type: string
                  minLength: 1
                  maxLength: 4000
                contactEmail:
                  type: string
                  maxLength: 320
                contactPhone:
                  type: string
                  maxLength: 64
                instagramUrl:
                  type: string
                  maxLength: 2000
                spotifyUrl:
                  type: string
                  maxLength: 2000
                seoTitle:
                  type: string
                  minLength: 1
                  maxLength: 180
                seoDescription:
                  type: string
                  minLength: 1
                  maxLength: 320
                seoImageUrl:
                  type: string
                  maxLength: 2000
                services:
                  maxItems: 12
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                        minLength: 1
                        maxLength: 160
                      body:
                        type: string
                        minLength: 1
                        maxLength: 1500
                      imageUrl:
                        type: string
                        maxLength: 2000
                      imageAlt:
                        default: ""
                        type: string
                        maxLength: 240
                    required:
                      - title
                      - body
                gallery:
                  maxItems: 40
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        maxLength: 2000
                      alt:
                        type: string
                        maxLength: 240
                    required:
                      - url
                      - alt
                publicCopy:
                  type: object
                  properties:
                    navigation:
                      type: object
                      properties:
                        home:
                          type: string
                          minLength: 1
                          maxLength: 80
                        about:
                          type: string
                          minLength: 1
                          maxLength: 80
                        media:
                          type: string
                          minLength: 1
                          maxLength: 80
                        agenda:
                          type: string
                          minLength: 1
                          maxLength: 80
                        booking:
                          type: string
                          minLength: 1
                          maxLength: 80
                        menu:
                          type: string
                          minLength: 1
                          maxLength: 80
                        close:
                          type: string
                          minLength: 1
                          maxLength: 80
                        mobileEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        mobileBooking:
                          type: string
                          minLength: 1
                          maxLength: 160
                      required:
                        - home
                        - about
                        - media
                        - agenda
                        - booking
                        - menu
                        - close
                        - mobileEyebrow
                        - mobileBooking
                    footer:
                      type: object
                      properties:
                        eyebrow:
                          type: string
                          minLength: 1
                          maxLength: 240
                        title:
                          type: string
                          minLength: 1
                          maxLength: 400
                        cta:
                          type: string
                          minLength: 1
                          maxLength: 160
                        location:
                          type: string
                          minLength: 1
                          maxLength: 160
                        instagram:
                          type: string
                          minLength: 1
                          maxLength: 80
                        spotify:
                          type: string
                          minLength: 1
                          maxLength: 80
                        email:
                          type: string
                          minLength: 1
                          maxLength: 80
                      required:
                        - eyebrow
                        - title
                        - cta
                        - location
                        - instagram
                        - spotify
                        - email
                    home:
                      type: object
                      properties:
                        secondaryCta:
                          type: string
                          minLength: 1
                          maxLength: 160
                        heroCaption:
                          type: string
                          minLength: 1
                          maxLength: 240
                        scrollLabel:
                          type: string
                          minLength: 1
                          maxLength: 80
                        visualEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        visualBody:
                          type: string
                          maxLength: 500
                        visualCaption:
                          type: string
                          minLength: 1
                          maxLength: 240
                        aboutCta:
                          type: string
                          minLength: 1
                          maxLength: 160
                        aboutImageCaption:
                          type: string
                          minLength: 1
                          maxLength: 300
                        servicesEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        servicesBody:
                          type: string
                          minLength: 1
                          maxLength: 500
                        proofEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        proofQuote:
                          type: string
                          minLength: 1
                          maxLength: 600
                        proofTags:
                          minItems: 1
                          maxItems: 12
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 240
                        bookingCta:
                          type: string
                          minLength: 1
                          maxLength: 160
                      required:
                        - secondaryCta
                        - heroCaption
                        - scrollLabel
                        - visualEyebrow
                        - visualBody
                        - visualCaption
                        - aboutCta
                        - aboutImageCaption
                        - servicesEyebrow
                        - servicesBody
                        - proofEyebrow
                        - proofQuote
                        - proofTags
                        - bookingCta
                    about:
                      type: object
                      properties:
                        imageEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        imageCaption:
                          type: string
                          minLength: 1
                          maxLength: 240
                        storyTitle:
                          type: string
                          minLength: 1
                          maxLength: 500
                        storyBody1:
                          type: string
                          minLength: 1
                          maxLength: 1200
                        storyBody2:
                          type: string
                          minLength: 1
                          maxLength: 1200
                        momentEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        momentQuote:
                          type: string
                          minLength: 1
                          maxLength: 500
                        momentBody:
                          type: string
                          minLength: 1
                          maxLength: 700
                        principlesEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        principlesTitle:
                          type: string
                          minLength: 1
                          maxLength: 300
                        principles:
                          minItems: 1
                          maxItems: 8
                          type: array
                          items:
                            type: object
                            properties:
                              title:
                                type: string
                                minLength: 1
                                maxLength: 160
                              body:
                                type: string
                                minLength: 1
                                maxLength: 700
                            required:
                              - title
                              - body
                        ctaEyebrow:
                          type: string
                          minLength: 1
                          maxLength: 160
                        ctaTitle:
                          type: string
                          minLength: 1
                          maxLength: 400
                        ctaLabel:
                          type: string
                          minLength: 1
                          maxLength: 160
                      required:
                        - imageEyebrow
                        - imageCaption
                        - storyTitle
                        - storyBody1
                        - storyBody2
                        - momentEyebrow
                        - momentQuote
                        - momentBody
                        - principlesEyebrow
                        - principlesTitle
                        - principles
                        - ctaEyebrow
                        - ctaTitle
                        - ctaLabel
                    media:
                      type: object
                      properties:
                        typeLabels:

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nightlight
      POSTGRES_USER: nightlight
      POSTGRES_PASSWORD: nightlight
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nightlight-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightlight -d nightlight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nightlight-db-dev:

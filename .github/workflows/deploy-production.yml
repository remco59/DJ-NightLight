name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dj-nightlight-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Unraid
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          ssh -p "$PORT" "$USER@$HOST"             "set -eu;
             cd '$DEPLOY_PATH';
             git fetch origin main;
             git checkout main;
             git reset --hard origin/main;
             docker compose --env-file '$ENV_FILE' -f docker-compose.unraid.yml up -d --build;
             docker compose --env-file '$ENV_FILE' -f docker-compose.unraid.yml ps"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nightlight}
      POSTGRES_USER: ${POSTGRES_USER:-nightlight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightlight}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nightlight-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nightlight} -d ${POSTGRES_DB:-nightlight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    environment:
      NIGHTLIGHT_UID: ${NIGHTLIGHT_UID:-10001}
      NIGHTLIGHT_GID: ${NIGHTLIGHT_GID:-10001}
    command:
      - /bin/sh
      - -ec
      - |
        for directory in /storage/uploads /storage/generated; do
          mkdir -p "$$directory"
          chown -R "$${NIGHTLIGHT_UID}:$${NIGHTLIGHT_GID}" "$$directory"
          chmod -R u+rwX,g+rwX "$$directory"
        done
    volumes:
      - nightlight-uploads:/storage/uploads
      - nightlight-generated:/storage/generated

  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nightlight}:${POSTGRES_PASSWORD:-nightlight}@db:5432/${POSTGRES_DB:-nightlight}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  render-worker:
    build:
      context: .
      dockerfile: Dockerfile.render-worker
      args:
        NIGHTLIGHT_UID: ${NIGHTLIGHT_UID:-10001}
        NIGHTLIGHT_GID: ${NIGHTLIGHT_GID:-10001}
    restart: unless-stopped
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://${POSTGRES_USER:-nightlight}:${POSTGRES_PASSWORD:-nightlight}@db:5432/${POSTGRES_DB:-nightlight}
      STORAGE_UPLOADS: /app/storage/uploads
      STORAGE_GENERATED: /app/storage/generated
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
    volumes:
      - nightlight-uploads:/app/storage/uploads:ro
      - nightlight-generated:/app/storage/generated
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      args:
        NIGHTLIGHT_UID: ${NIGHTLIGHT_UID:-10001}
        NIGHTLIGHT_GID: ${NIGHTLIGHT_GID:-10001}
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nightlight}:${POSTGRES_PASSWORD:-nightlight}@db:5432/${POSTGRES_DB:-nightlight}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_APP_VERSION: ${NUXT_APP_VERSION:-development}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-dev-only-change-me-at-least-32-characters}
      NUXT_SESSION_COOKIE_SECURE: ${NUXT_SESSION_COOKIE_SECURE:-false}
      NUXT_OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-dev-bootstrap-change-me}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NUXT_STRIPE_SECRET_KEY: ${STRIPE_RESTRICTED_KEY:-}
      NUXT_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      NUXT_GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      NUXT_GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      NUXT_GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      REVIEW_URL: ${REVIEW_URL:-}
      NUXT_EMAIL_API_KEY: ${RESEND_API_KEY:-}
      NUXT_EMAIL_FROM: ${EMAIL_FROM:-}
      NUXT_EMAIL_REVIEW_URL: ${REVIEW_URL:-}
      NUXT_STORAGE_UPLOADS: /app/storage/uploads
      NUXT_STORAGE_GENERATED: /app/storage/generated
      NUXT_STORAGE_BACKUPS: /app/storage/backups
    volumes:
      - nightlight-uploads:/app/storage/uploads
      - nightlight-generated:/app/storage/generated
      - nightlight-backups:/app/storage/backups
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  nightlight-db:
  nightlight-uploads:
  nightlight-generated:
  nightlight-backups:

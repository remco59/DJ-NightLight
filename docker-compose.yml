services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nightlight}
      POSTGRES_USER: ${POSTGRES_USER:-nightlight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightlight}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nightlight-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nightlight} -d ${POSTGRES_DB:-nightlight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nightlight}:${POSTGRES_PASSWORD:-nightlight}@db:5432/${POSTGRES_DB:-nightlight}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nightlight}:${POSTGRES_PASSWORD:-nightlight}@db:5432/${POSTGRES_DB:-nightlight}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_APP_VERSION: ${NUXT_APP_VERSION:-development}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-dev-only-change-me-at-least-32-characters}
      NUXT_SESSION_COOKIE_SECURE: ${NUXT_SESSION_COOKIE_SECURE:-false}
      NUXT_OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-dev-bootstrap-change-me}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  nightlight-db:

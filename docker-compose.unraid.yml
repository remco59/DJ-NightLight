services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${APP_DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_APP_VERSION: ${NUXT_APP_VERSION:-production}
      NUXT_STORAGE_UPLOADS: /app/storage/uploads
      NUXT_STORAGE_GENERATED: /app/storage/generated
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    volumes:
      - ${APP_DATA_ROOT}/uploads:/app/storage/uploads
      - ${APP_DATA_ROOT}/generated:/app/storage/generated
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - proxy

networks:
  backend:
    internal: true
  proxy:
    name: ${PROXY_NETWORK:-proxynet}
    external: true

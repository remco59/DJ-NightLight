services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${APP_DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    environment:
      NIGHTLIGHT_UID: ${NIGHTLIGHT_UID:-10001}
      NIGHTLIGHT_GID: ${NIGHTLIGHT_GID:-10001}
    command:
      - /bin/sh
      - -ec
      - |
        for directory in /storage/uploads /storage/generated; do
          mkdir -p "$$directory"
          chown -R "$${NIGHTLIGHT_UID}:$${NIGHTLIGHT_GID}" "$$directory"
          chmod -R u+rwX,g+rwX "$$directory"
        done
    volumes:
      - ${APP_DATA_ROOT}/uploads:/storage/uploads
      - ${APP_DATA_ROOT}/generated:/storage/generated
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKUP_ROOT: /backups
      UPLOADS_ROOT: /uploads
      GENERATED_ROOT: /generated
      CONFIG_ROOT: /config
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_SECONDARY_ROOT: /secondary
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          /scripts/backup.sh || echo "Backup run failed" >&2
          sleep "${BACKUP_INTERVAL_SECONDS}"
        done
    volumes:
      - ./scripts:/scripts:ro
      - ${APP_DATA_ROOT}/backups:/backups
      - ${APP_DATA_ROOT}/uploads:/uploads:ro
      - ${APP_DATA_ROOT}/generated:/generated:ro
      - ${APP_DATA_ROOT}/config:/config:ro
      - ${BACKUP_SECONDARY_ROOT:-/mnt/user/backups/djnightlight}:/secondary
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  render-worker:
    build:
      context: .
      dockerfile: Dockerfile.render-worker
      args:
        NIGHTLIGHT_UID: ${NIGHTLIGHT_UID:-10001}
        NIGHTLIGHT_GID: ${NIGHTLIGHT_GID:-10001}
    restart: unless-stopped
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_UPLOADS: /app/storage/uploads
      STORAGE_GENERATED: /app/storage/generated
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
    volumes:
      - ${APP_DATA_ROOT}/uploads:/app/storage/uploads:ro
      - ${APP_DATA_ROOT}/generated:/app/storage/generated
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NIGHTLIGHT_UID: ${NIGHTLIGHT_UID:-10001}
        NIGHTLIGHT_GID: ${NIGHTLIGHT_GID:-10001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_APP_VERSION: ${NUXT_APP_VERSION:-production}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_SESSION_COOKIE_SECURE: ${NUXT_SESSION_COOKIE_SECURE:-true}
      NUXT_OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NUXT_STRIPE_SECRET_KEY: ${STRIPE_RESTRICTED_KEY:-}
      NUXT_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      NUXT_GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      NUXT_GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      NUXT_GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      REVIEW_URL: ${REVIEW_URL:-}
      NUXT_EMAIL_API_KEY: ${RESEND_API_KEY:-}
      NUXT_EMAIL_FROM: ${EMAIL_FROM:-}
      NUXT_EMAIL_REVIEW_URL: ${REVIEW_URL:-}
      NUXT_STORAGE_UPLOADS: /app/storage/uploads
      NUXT_STORAGE_GENERATED: /app/storage/generated
      NUXT_STORAGE_BACKUPS: /app/storage/backups
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    volumes:
      - ${APP_DATA_ROOT}/uploads:/app/storage/uploads
      - ${APP_DATA_ROOT}/generated:/app/storage/generated
      - ${APP_DATA_ROOT}/backups:/app/storage/backups:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - proxy

networks:
  backend:
    internal: true
  proxy:
    name: ${PROXY_NETWORK:-proxynet}
    external: true

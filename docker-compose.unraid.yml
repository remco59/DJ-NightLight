services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${APP_DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_APP_VERSION: ${NUXT_APP_VERSION:-production}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_SESSION_COOKIE_SECURE: ${NUXT_SESSION_COOKIE_SECURE:-true}
      NUXT_OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      REVIEW_URL: ${REVIEW_URL:-}
      NUXT_STORAGE_UPLOADS: /app/storage/uploads
      NUXT_STORAGE_GENERATED: /app/storage/generated
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    volumes:
      - ${APP_DATA_ROOT}/uploads:/app/storage/uploads
      - ${APP_DATA_ROOT}/generated:/app/storage/generated
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - proxy


  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ops/backup-loop.sh"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NUXT_APP_VERSION: ${NUXT_APP_VERSION:-production}
      BACKUP_ROOT: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_SECONDARY_ENABLED: ${BACKUP_SECONDARY_ENABLED:-false}
    volumes:
      - ./ops:/ops:ro
      - ${APP_DATA_ROOT}/uploads:/source/uploads:ro
      - ${APP_DATA_ROOT}/generated:/source/generated:ro
      - ${APP_DATA_ROOT}/backups:/backups
      - ${BACKUP_SECONDARY_ROOT:-${APP_DATA_ROOT}/backups-secondary}:/secondary
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  restore-test:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ops/restore-test-loop.sh"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ROOT: /backups
      RESTORE_TEST_START_DELAY_SECONDS: ${RESTORE_TEST_START_DELAY_SECONDS:-600}
      RESTORE_TEST_INTERVAL_SECONDS: ${RESTORE_TEST_INTERVAL_SECONDS:-604800}
    volumes:
      - ./ops:/ops:ro
      - ${APP_DATA_ROOT}/backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backup:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    internal: true
  proxy:
    name: ${PROXY_NETWORK:-proxynet}
    external: true
